name: Backend CI/CD

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'fresh-backend/**'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'fresh-backend/**'
  workflow_dispatch:

env:
  JAVA_VERSION: '17'
  SPRING_BOOT_VERSION: '2.7.18'
  GRADLE_VERSION: '7.6.4'

jobs:
  # ==================== 后端编译检查 ====================
  build-backend:
    name: Build Backend JAR
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('fresh-backend/**/build.gradle', 'fresh-backend/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission
        run: chmod +x ${{ github.workspace }}/fresh-backend/gradlew

      - name: Build JAR
        run: |
          cd ${{ github.workspace }}/fresh-backend
          ./gradlew bootJar --no-daemon

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: fresh-backend/build/libs/*.jar
          retention-days: 30

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports
          path: |
            fresh-backend/build/reports/
            fresh-backend/build/test-results/
          retention-days: 7

  # ==================== 后端单元测试 ====================
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission
        run: chmod +x ${{ github.workspace }}/fresh-backend/gradlew

      - name: Run tests
        run: |
          cd ${{ github.workspace }}/fresh-backend
          ./gradlew test --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: fresh-backend/build/reports/tests/
          retention-days: 14

  # ==================== 后端 Docker 镜像构建 ====================
  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: build-backend
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build JAR
        run: |
          cd ${{ github.workspace }}/fresh-backend
          ./gradlew bootJar --no-daemon

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./fresh-backend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/fresh-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/fresh-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
