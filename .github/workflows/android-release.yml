name: Android Release Build

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: 'Build flavor'
        required: false
        default: 'dev'
      gradle_opts:
        description: 'Gradle options (e.g. --info)'
        required: false
        default: ''

env:
  JAVA_VERSION: '17'
  ANDROID_COMPILE_SDK: 34

jobs:
  build-release:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v2

      - name: Grant execute permission
        run: chmod +x ${{ github.workspace }}/FreshProcurementApp/gradlew

      - name: Build release APK
        run: |
          cd ${{ github.workspace }}/FreshProcurementApp
          ./gradlew assembleRelease --no-daemon ${{ github.event.inputs.gradle_opts }}

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: FreshProcurementApp/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload mapping file (proguard)
        uses: actions/upload-artifact@v4
        with:
          name: proguard-mapping
          path: FreshProcurementApp/app/build/outputs/mapping/**/mapping.txt
          retention-days: 90
