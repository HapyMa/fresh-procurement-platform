server:
  port: 8080

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/fresh_procurement?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:FreshProcurement2024}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect
  sql:
    init:
      mode: always
      continue-on-error: true
  h2:
    console:
      enabled: false  # 生产环境禁用 H2 Console

jwt:
  secret: ${JWT_SECRET:FreshProcurementPlatformSecretKey2024ForJwtTokenGenerationMustBeLongEnough}
  expiration: ${JWT_EXPIRATION:86400000}

# CORS 配置
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://your-production-domain.com}

spring.servlet.multipart:
  max-file-size: 10MB
  max-request-size: 10MB
