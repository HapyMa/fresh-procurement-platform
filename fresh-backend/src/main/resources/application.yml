server:
  port: 8080

spring:
  datasource:
    # 默认使用H2内存数据库，无需安装MySQL
    url: jdbc:h2:mem:freshdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: always

# JWT 配置
jwt:
  secret: FreshProcurementPlatformSecretKey2024ForJwtTokenGenerationMustBeLongEnough
  expiration: 86400000

# 文件上传
spring.servlet.multipart:
  max-file-size: 10MB
  max-request-size: 10MB
