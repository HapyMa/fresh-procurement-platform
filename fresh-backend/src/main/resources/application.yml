server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:mem:freshdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: always

jwt:
  secret: ${JWT_SECRET:FreshProcurementPlatformSecretKey2024ForJwtTokenGenerationMustBeLongEnough}
  expiration: ${JWT_EXPIRATION:86400000}

# CORS 配置
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}

spring.servlet.multipart:
  max-file-size: 10MB
  max-request-size: 10MB

# 热更新配置 (仅开发环境生效)
devtools:
  restart:
    enabled: true
    additional-paths: src/main/java
    trigger-file: .reloadtrigger
  livereload:
    enabled: true
