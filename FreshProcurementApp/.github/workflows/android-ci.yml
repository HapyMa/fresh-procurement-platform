name: Android CI/CD

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  JAVA_VERSION: '17'
  ANDROID_COMPILE_SDK: 34
  ANDROID_BUILD_TOOLS: 34.0.0

jobs:
  # ==================== Android 构建 ====================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x ${{ github.workspace }}/FreshProcurementApp/gradlew

      - name: Build debug APK
        run: |
          cd ${{ github.workspace }}/FreshProcurementApp
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1

      - name: List APK files
        run: find ${{ github.workspace }}/FreshProcurementApp/app/build/outputs -name "*.apk" -type f 2>/dev/null || echo "No APK found"

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: FreshProcurementApp/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload build outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-outputs
          path: |
            FreshProcurementApp/app/build/outputs/
            FreshProcurementApp/app/build/reports/
          retention-days: 7

  # ==================== 代码检查 ====================
  lint:
    name: Lint Check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x ${{ github.workspace }}/FreshProcurementApp/gradlew

      - name: Run lint
        run: |
          cd ${{ github.workspace }}/FreshProcurementApp
          ./gradlew lintDebug --no-daemon

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: FreshProcurementApp/app/build/reports/lint-results-*.html
          retention-days: 7
